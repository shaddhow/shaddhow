<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CC9F0" />
      <stop offset="50%" stop-color="#7209B7" />
      <stop offset="100%" stop-color="#F72585" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#4CC9F0" />
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="22" fill="url(#bg)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="840" cy="70" r="140" fill="#F72585" fill-opacity="0.16">
    <animate attributeName="r" values="130;165;130" dur="6s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.12;0.24;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="260" r="160" fill="#4CC9F0" fill-opacity="0.12">
    <animate attributeName="r" values="150;185;150" dur="7s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite" />
  </circle>

  <rect x="1.5" y="1.5" width="997" height="317" rx="20.5" stroke="url(#strokeGrad)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Status Badge with Radar Pulse -->
  <rect x="48" y="38" width="270" height="28" rx="14" fill="#131C31" stroke="#334155" />
  <circle cx="64" cy="52" r="4" fill="#10B981" fill-opacity="0.6">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="64" cy="52" r="4" fill="#10B981" />
  <text x="78" y="56" font-family="monospace" font-size="11" font-weight="bold" fill="#4CC9F0">OPEN FOR COLLAB + FREELANCE</text>

  <!-- Identity -->
  <text x="48" y="116" font-family="sans-serif" font-size="40" font-weight="bold" fill="#F8FAFC">Mahabub Shaddhow</text>
  <text x="48" y="148" font-family="sans-serif" font-size="17" fill="#94A3B8">Mobile App Engineer | Creative UI Architect</text>
  <text x="48" y="176" font-family="sans-serif" font-size="13.5" fill="#64748B">Crafting high-performance Flutter and Native Android apps</text>
  <text x="48" y="196" font-family="sans-serif" font-size="13.5" fill="#64748B">with glassmorphic interfaces, motion design and AI workflows.</text>

  <!-- Tech Pills -->
  <rect x="48" y="224" width="82" height="28" rx="8" fill="#1E293B" />
  <text x="67" y="242" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">Flutter</text>

  <rect x="140" y="224" width="112" height="28" rx="8" fill="#1E293B" />
  <text x="155" y="242" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">Android Java</text>

  <rect x="262" y="224" width="90" height="28" rx="8" fill="#1E293B" />
  <text x="280" y="242" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">Firebase</text>

  <rect x="362" y="224" width="112" height="28" rx="8" fill="#1E293B" />
  <text x="378" y="242" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0">Figma + Motion</text>

  <text x="48" y="286" font-family="monospace" font-size="11" fill="#64748B">@shaddhow  |  B.Sc. in CSE (BUBT)  |  Dhaka, Bangladesh</text>

  <!-- Right Side Interactive Device UI -->
  <rect x="650" y="28" width="290" height="264" rx="24" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
  <rect x="758" y="40" width="74" height="9" rx="4.5" fill="#1E293B" />

  <!-- CRConnect Live Card -->
  <rect x="668" y="64" width="254" height="72" rx="14" fill="#131C31" stroke="#4CC9F0" stroke-opacity="0.45" />
  <circle cx="700" cy="100" r="14" fill="#4CC9F0" fill-opacity="0.2">
    <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="6" fill="#4CC9F0" />
  <text x="726" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">CRConnect v1.2</text>
  <text x="726" y="112" font-family="sans-serif" font-size="11" fill="#94A3B8">Live Campus Election Engine</text>
  <rect x="862" y="84" width="46" height="20" rx="6" fill="#10B981" fill-opacity="0.2" />
  <text x="872" y="98" font-family="monospace" font-size="10" font-weight="bold" fill="#34D399">
    LIVE
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
  </text>

  <!-- Caloriq Animated Macro Ring Card -->
  <rect x="668" y="148" width="254" height="80" rx="14" fill="#131C31" stroke="#F72585" stroke-opacity="0.45" />
  <circle cx="702" cy="188" r="18" stroke="#1E293B" stroke-width="4" fill="none" />
  <circle cx="702" cy="188" r="18" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="75 115" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-190" dur="4s" repeatCount="indefinite" />
  </circle>
  <text x="734" y="183" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">Caloriq Nutrition</text>
  <text x="734" y="200" font-family="sans-serif" font-size="11" fill="#94A3B8">BMR / TDEE Macro Telemetry</text>
  <rect x="734" y="210" width="58" height="4" rx="2" fill="#4CC9F0">
    <animate attributeName="width" values="42;62;42" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <rect x="802" y="210" width="40" height="4" rx="2" fill="#F72585" />
  <rect x="848" y="210" width="28" height="4" rx="2" fill="#A855F7" />

  <!-- Floating Bottom Nav Dock -->
  <rect x="698" y="242" width="194" height="32" rx="16" fill="#1E293B" stroke="#475569" />
  <circle cx="738" cy="258" r="5" fill="#4CC9F0" />
  <circle cx="795" cy="258" r="6" fill="#F72585">
    <animate attributeName="r" values="5.5;7.5;5.5" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="852" cy="258" r="5" fill="#64748B" />
</svg>
