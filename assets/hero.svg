<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="orbPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 80) rotate(90) scale(180)">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F72585" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 280) rotate(90) scale(200)">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7209B7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F72585" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F72585" />
      <stop offset="100%" stop-color="#4CC9F0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .title { font: 800 40px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #F8FAFC; letter-spacing: -0.8px; }
    .subtitle { font: 500 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #94A3B8; }
    .mono { font: 600 12px 'JetBrains Mono', 'Fira Code', monospace; fill: #4CC9F0; letter-spacing: 1.2px; }
    .tag { font: 600 12px 'Segoe UI', sans-serif; fill: #E2E8F0; }
    .cardTitle { font: 700 13px 'Segoe UI', sans-serif; fill: #F8FAFC; }
    .cardSub { font: 400 11px 'Segoe UI', sans-serif; fill: #94A3B8; }

    @keyframes floatDevice {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.35); }
    }
    @keyframes orbShift {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }
    .device-float { animation: floatDevice 5s ease-in-out infinite; }
    .pulse { transform-origin: 64px 55px; animation: pulseDot 2.2s infinite ease-in-out; }
    .orb-anim { animation: orbShift 6s infinite ease-in-out; }
  </style>

  <!-- Base Frame -->
  <rect width="1000" height="340" rx="22" fill="url(#bgGrad)" />
  <rect width="1000" height="340" rx="22" fill="url(#grid)" />
  <rect width="1000" height="340" rx="22" fill="url(#orbPink)" class="orb-anim" />
  <rect width="1000" height="340" rx="22" fill="url(#orbCyan)" />
  <rect x="1" y="1" width="998" height="338" rx="21" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Left Content: Identity & Status -->
  <!-- Status Pill -->
  <rect x="48" y="40" width="275" height="30" rx="15" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <circle cx="64" cy="55" r="4.5" fill="#10B981" class="pulse" />
  <text x="78" y="59" class="mono">OPEN FOR COLLAB & FREELANCE</text>

  <!-- Main Heading -->
  <text x="48" y="122" class="title">Mahabub Shaddhow</text>
  <text x="48" y="154" class="subtitle">Mobile App Engineer & Creative UI Architect</text>
  <text x="48" y="180" class="cardSub" style="font-size: 13.5px;">Crafting high-performance Flutter & Native Android experiences</text>
  <text x="48" y="200" class="cardSub" style="font-size: 13.5px;">with glassmorphic interfaces, motion design & AI-accelerated workflows.</text>

  <!-- Tech Pills Row -->
  <rect x="48" y="232" width="84" height="30" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="68" y="251" class="tag">Flutter</text>

  <rect x="142" y="232" width="114" height="30" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="158" y="251" class="tag">Android (Java)</text>

  <rect x="266" y="232" width="94" height="30" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="285" y="251" class="tag">Firebase</text>

  <rect x="370" y="232" width="118" height="30" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="386" y="251" class="tag">Figma & Motion</text>

  <!-- Bottom Location / Handle Metadata -->
  <text x="48" y="298" class="mono" style="fill: #64748B; font-size: 11px;">@shaddhow  •  B.Sc. in CSE (BUBT)  •  Dhaka, Bangladesh</text>

  <!-- Right Content: Floating Mobile UI Mockup -->
  <g class="device-float">
    <!-- Outer Phone Shell -->
    <rect x="650" y="34" width="290" height="272" rx="24" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    <!-- Dynamic Island / Top Notch -->
    <rect x="758" y="46" width="74" height="10" rx="5" fill="#1E293B" />

    <!-- UI Card 1 inside Phone (CRConnect Preview) -->
    <rect x="668" y="70" width="254" height="74" rx="14" fill="#131C31" stroke="#4CC9F0" stroke-opacity="0.35" />
    <rect x="682" y="84" width="36" height="36" rx="10" fill="#4CC9F0" fill-opacity="0.15" />
    <circle cx="700" cy="102" r="8" fill="#4CC9F0" />
    <text x="730" y="99" class="cardTitle">CRConnect v1.2</text>
    <text x="730" y="116" class="cardSub">Live Campus Election Engine</text>
    <rect x="862" y="88" width="46" height="20" rx="6" fill="#10B981" fill-opacity="0.2" />
    <text x="871" y="102" class="mono" style="fill: #34D399; font-size: 10px;">LIVE</text>

    <!-- UI Card 2 inside Phone (Caloriq Macro Ring Preview) -->
    <rect x="668" y="156" width="254" height="84" rx="14" fill="#131C31" stroke="#F72585" stroke-opacity="0.35" />
    <!-- Circular Progress Ring -->
    <circle cx="704" cy="198" r="20" stroke="#1E293B" stroke-width="4.5" fill="none" />
    <circle cx="704" cy="198" r="20" stroke="url(#accentPill)" stroke-width="4.5" stroke-dasharray="95 125" stroke-linecap="round" fill="none" />
    <text x="738" y="193" class="cardTitle">Caloriq Nutrition</text>
    <text x="738" y="210" class="cardSub">BMR / TDEE Macro Telemetry</text>
    <!-- Mini Bar Indicators -->
    <rect x="738" y="220" width="60" height="5" rx="2.5" fill="#4CC9F0" />
    <rect x="804" y="220" width="42" height="5" rx="2.5" fill="#F72585" />
    <rect x="852" y="220" width="30" height="5" rx="2.5" fill="#A855F7" />

    <!-- Floating Bottom Nav Dock inside Phone -->
    <rect x="698" y="254" width="194" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
    <circle cx="738" cy="271" r="5" fill="#4CC9F0" />
    <circle cx="795" cy="271" r="6" fill="#F72585" />
    <circle cx="852" cy="271" r="5" fill="#64748B" />
  </g>
</svg>
